
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Library</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header class="header">
        <h1>My Library</h1>
    </header>

    
<main class="container">

    <section class="library-intro">
        <h2>Your Personal Library</h2>
        <p>Keep track of your favorite books and reading progress.</p>
    </section>

    <section class="library-section">

        <div class="library-controls">
            <h2>My Collection</h2>
            <button id="new-book-btn">+ Add New Book</button>
        </div>

        <div id="book-container" class="book-container">

            <!-- Book cards will be generated here using JavaScript -->

        </div>

    </section>

</main>

<dialog id="book-dialog">

    <h2>Add a New Book</h2>

    <form id="book-form">

        <div class="form-group">
            <label for="title">Book Title</label>
            <input type="text" id="title" name="title" required>
        </div>

        <div class="form-group">
            <label for="author">Author</label>
            <input type="text" id="author" name="author" required>
        </div>

        <div class="form-group">
            <label for="pages">Number of Pages</label>
            <input type="number" id="pages" name="pages" min="1" required>
        </div>

        <div class="form-group">
            <label for="read">Have you read this book?</label>
            <input type="checkbox" id="read" name="read">
        </div>

        <div class="form-actions">
            <button type="submit">Add Book</button>
            <button type="button" id="close-dialog-btn">Cancel</button>
        </div>

    </form>

</dialog>


</body>
</html>
